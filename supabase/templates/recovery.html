<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Tokonesia password</title>
  </head>
  <body style="margin:0;background:#fdf9f5;color:#2f251d;font-family:Arial,sans-serif;">
    <div style="max-width:520px;margin:0 auto;padding:32px 20px;">
      <div style="background:#ffffff;border:1px solid #eadfd4;border-radius:8px;padding:28px;">
        <h1 style="font-size:20px;line-height:1.3;margin:0 0 12px;color:#2f251d;">Reset your password</h1>
        <p style="font-size:14px;line-height:1.6;margin:0 0 22px;color:#605850;">
          Use the secure button below to create a new Tokonesia password.
        </p>
        <a
          href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery&email={{ .Email }}"
          style="display:block;background:#511e0b;color:#ffffff;text-decoration:none;text-align:center;border-radius:8px;padding:14px 18px;font-size:14px;font-weight:700;letter-spacing:.6px;"
        >
          Reset Password
        </a>
        <p style="font-size:13px;line-height:1.6;margin:22px 0 0;color:#605850;">
          This link expires soon. If you did not request a password reset, you can ignore this email.
        </p>
      </div>
    </div>
  </body>
</html>
