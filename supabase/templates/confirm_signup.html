<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Tokonesia verification code</title>
  </head>
  <body style="margin:0;background:#fdf9f5;color:#2f251d;font-family:Arial,sans-serif;">
    <div style="max-width:520px;margin:0 auto;padding:32px 20px;">
      <div style="background:#ffffff;border:1px solid #eadfd4;border-radius:8px;padding:28px;">
        <h1 style="font-size:20px;line-height:1.3;margin:0 0 12px;color:#2f251d;">Verify your email</h1>
        <p style="font-size:14px;line-height:1.6;margin:0 0 20px;color:#605850;">
          Enter this code in Tokonesia to finish creating your account.
        </p>
        <div style="font-size:32px;letter-spacing:10px;font-weight:700;color:#511e0b;background:#fdf9f5;border:1px solid #eadfd4;border-radius:8px;padding:18px;text-align:center;">
          {{ .Token }}
        </div>
        <p style="font-size:13px;line-height:1.6;margin:20px 0 0;color:#605850;">
          This code expires soon. If you did not create a Tokonesia account, you can ignore this email.
        </p>
      </div>
    </div>
  </body>
</html>
